name: Git minimum version

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  git-2-34:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git ssh curl build-essential pkg-config libssl-dev
          git --version
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup component add clippy rustfmt
      - name: Format
        run: |
          source "$HOME/.cargo/env"
          cargo fmt --all -- --check
      - name: Clippy
        run: |
          source "$HOME/.cargo/env"
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        env:
          QSG_REQUIRE_SSH_KEYGEN: "1"
        run: |
          source "$HOME/.cargo/env"
          cargo test -p qsg-ssh-keygen --test git_end_to_end -- --nocapture
