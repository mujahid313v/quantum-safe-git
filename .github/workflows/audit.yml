name: Supply chain

# Scheduled workflows consume private-repo Actions minutes.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Install cargo-audit
        # cargo-audit 0.22.2 is licensed MIT OR Apache-2.0.
        # Installing from source increases CI time but --locked pins its
        # dependency tree, and pinning the version makes the binary reproducible.
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Run cargo audit
        # Report all findings; do not fail the job (advisories are tracked as
        # follow-up issues and not fixed in this PR). Remove continue-on-error
        # and fix the findings before merging if this is a release PR.
        continue-on-error: true
        run: cargo audit

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Install cargo-deny
        # cargo-deny 0.20.2 is licensed MIT OR Apache-2.0.
        # Installing from source increases CI time but --locked pins its
        # dependency tree, and pinning the version makes the binary reproducible.
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Run cargo deny check
        run: cargo deny check
