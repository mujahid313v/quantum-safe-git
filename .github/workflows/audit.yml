name: Supply chain

# Scheduled workflows consume private-repo Actions minutes.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Install cargo-audit
        # cargo-audit 0.22.2 is licensed MIT OR Apache-2.0.
        # Installing from source increases CI time but --locked pins its
        # dependency tree, and pinning the version makes the binary reproducible.
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Run cargo audit
        run: cargo audit

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Install cargo-deny
        # cargo-deny 0.20.2 is licensed MIT OR Apache-2.0.
        # Installing from source increases CI time but --locked pins its
        # dependency tree, and pinning the version makes the binary reproducible.
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Run cargo deny check
        run: cargo deny check
