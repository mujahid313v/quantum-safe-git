name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fetch pinned NIST ACVP vectors
        run: python3 crates/qsg-core/tests/fetch_acvp_vectors.py
      - name: OpenSSH version
        run: ssh -V
      - name: Test
        env:
          QSG_REQUIRE_SSH_KEYGEN: "1"
        run: cargo test --workspace
