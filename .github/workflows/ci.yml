name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fetch pinned NIST ACVP vectors
        run: python3 crates/qsg-core/tests/fetch_acvp_vectors.py
      - name: OpenSSH version
        run: ssh -V
      - name: Git verify-time behavior
        run: python3 tools/spike/verify_time.py --check
      - name: Git SSH interface contract
        env:
          QSG_REQUIRE_SSH_KEYGEN: "1"
        run: python3 tools/spike/git_interface_contract.py
      - name: Git trusted and untrusted call matrix
        env:
          QSG_REQUIRE_SSH_KEYGEN: "1"
        run: python3 tools/spike/git_call_state_matrix.py
      - name: Test
        env:
          QSG_REQUIRE_SSH_KEYGEN: "1"
        run: cargo test --workspace --no-fail-fast
      - name: Shim output (nocapture)
        env:
          QSG_REQUIRE_SSH_KEYGEN: "1"
        run: cargo test -p qsg-ssh-keygen --test git_end_to_end -- --nocapture
