[package]
name = "qsg"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
base64 = "=0.22.1"
qsg-keystore = { path = "../qsg-keystore" }
qsg-sshsig = { path = "../qsg-sshsig" }
qsg-trust = { path = "../qsg-trust" }
qsg-verify = { path = "../qsg-verify" }
rpassword = "=7.5.4"
time = { version = "=0.3.44", default-features = false, features = ["local-offset"] }
zeroize = "=1.8.2"

[dev-dependencies]
proptest = "=1.9.0"
tempfile = "=3.27.0"
