[package]
name = "qsg-keystore"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "=0.22.1"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
qsg-core = { path = "../qsg-core" }
qsg-sshsig = { path = "../qsg-sshsig" }
thiserror = "=2.0.18"
zeroize = "=1.8.2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
proptest = "=1.9.0"
tempfile = "=3.27.0"
