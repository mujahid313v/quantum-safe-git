# cargo-deny configuration
# Licenses in the dependency tree (from `cargo metadata`):
#   Apache-2.0 OR MIT              — ml-dsa, chacha20poly1305, der, zeroize, ...
#   MIT OR Apache-2.0              — aead, argon2, base64, libc, serde, sha2, ...
#   Apache-2.0                     — rpassword, rtoolbox
#   MIT                            — generic-array, libm, spin
#   BSD-3-Clause                   — curve25519-dalek, ed25519-dalek, subtle
#   (MIT OR Apache-2.0) AND Unicode-3.0 — unicode-ident
#   Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT — rustix, linux-raw-sys
#   BSD-2-Clause OR Apache-2.0 OR MIT — zerocopy
#   MIT OR Apache-2.0 OR BSD-1-Clause — fiat-crypto
#   MIT OR Apache-2.0 OR LGPL-2.1-or-later — r-efi
#   MIT/Apache-2.0 (slash = OR)    — rusty-fork, wait-timeout, quick-error, ...
#   Apache-2.0 / MIT (slash = OR) — fnv
#
# How OR-expressions are evaluated: cargo-deny accepts the package if at least
# one branch of the OR is in the allow list. AND requires all branches to be
# satisfied. So (MIT OR Apache-2.0) AND Unicode-3.0 passes because MIT is in the
# allow list AND Unicode-3.0 is in the allow list.

[graph]
all-features = true

[advisories]
# cargo-deny 0.20 removed the `vulnerability`, `unsound`, and `notice` fields:
# all vulnerability advisories now always emit errors unless explicitly ignored.
# See: https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
# The three advisories below are ignored with reasons pending triage issues;
# remove each ignore entry when the underlying crate is bumped.
ignore = [
    # RUSTSEC-2026-0009: time DoS via stack exhaustion in RFC 2822 parse.
    # Affected functions: Date::parse, OffsetDateTime::parse, etc.
    # QSGit never calls any of these; it uses only from_unix_timestamp and now_utc.
    # Tracked: bump time >=0.3.47 (MSRV check needed: 0.3.47 requires Rust 1.88,
    # workspace MSRV is 1.87). See issue filed in E2.
    { id = "RUSTSEC-2026-0009", reason = "QSGit does not call time::parse; tracked in bump-time issue" },
    # RUSTSEC-2023-0071: rsa Marvin Attack timing sidechannel.
    # rsa 0.9.10 is a feature-gated optional dep of ssh-key; QSGit does NOT
    # activate the rsa feature (uses only ed25519,std). rsa is not compiled into
    # any release binary. Tracked in triage issue.
    { id = "RUSTSEC-2023-0071", reason = "rsa feature not activated in ssh-key; not compiled into any binary" },
    # RUSTSEC-2026-0387: crypto-bigint constant-time issues.
    # crypto-bigint 0.5.5 is a transitive dep of rsa, which is not compiled in
    # (see RUSTSEC-2023-0071 above). Not reachable from any release binary.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint pulled via rsa feature not activated; not compiled in" },
]
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "BSD-1-Clause",
    "Unicode-3.0",
    "LGPL-2.1-or-later",
]
# How OR-expressions work: cargo-deny passes a package if at least one branch
# of the OR is in this allow list. AND requires every branch to be satisfied.
# So "(MIT OR Apache-2.0) AND Unicode-3.0" passes because both MIT and
# Unicode-3.0 are listed. "MIT OR Apache-2.0 OR LGPL-2.1-or-later" passes
# because MIT is listed. "BSD-2-Clause OR Apache-2.0 OR MIT" passes because
# MIT is listed. Every expression in the current lockfile is covered.
#
# Private workspace members (no license field) are ignored via the setting below.
confidence-threshold = 0.8
private.ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-registry = "deny"
unknown-git = "deny"
